name: Fedora RPM

on:
  workflow_dispatch:
  push:
    branches: [ master ]

permissions:
  contents: write

concurrency:
  group: fedora-rpm-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  rpm:
    runs-on: ubuntu-24.04
    container:
      image: fedora:44
    env:
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
    defaults:
      run:
        shell: bash

    steps:
      - name: Install bootstrap tools
        run: >-
          dnf install -y
          binutils
          ccache
          coreutils
          cpio
          dnf5-plugins
          file
          findutils
          git-core
          gzip
          rpm-build
          sed
          tar

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Restore compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: rpm-ccache-fedora44-x86_64-gcc-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'icons/**', 'src/**', 'tests/**', 'libraries/kColorPicker/**', 'libraries/kImageAnnotator/**') }}
          restore-keys: |
            rpm-ccache-fedora44-x86_64-gcc-

      - name: Configure compiler cache
        run: |
          echo /usr/lib64/ccache >> "$GITHUB_PATH"
          ccache --max-size "$CCACHE_MAXSIZE"
          ccache --zero-stats

      - name: Prepare self-contained RPM source
        id: source
        run: |
          set -euo pipefail
          export LC_ALL=C

          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/libraries/kColorPicker"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/libraries/kImageAnnotator"

          commit=$(git rev-parse HEAD)
          short_commit=$(git rev-parse --short=8 HEAD)
          commit_count=$(git rev-list --count HEAD)
          commit_epoch=$(git show -s --format=%ct HEAD)
          base_version=$(sed -nE 's/^project\(ksnip .* VERSION ([0-9.]+)\)$/\1/p' CMakeLists.txt)
          version="${base_version}^${commit_count}.g${short_commit}"
          topdir="$GITHUB_WORKSPACE/rpmbuild"

          test -n "$base_version"
          mkdir -p "$topdir"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}

          git ls-files --recurse-submodules -z |
            sort -z |
            tar --create --null --no-recursion --files-from=- \
              --format=gnu \
              --owner=0 --group=0 --numeric-owner \
              --mtime="@${commit_epoch}" \
              --transform="s|^|ksnip-${version}/|" |
            gzip -9n > "$topdir/SOURCES/ksnip-${version}.tar.gz"
          touch -d "@${commit_epoch}" "$topdir/SOURCES/ksnip-${version}.tar.gz"

          sed \
            -e "s/@COMMIT@/${commit}/g" \
            -e "s/@SHORT_COMMIT@/${short_commit}/g" \
            -e "s/@COMMIT_COUNT@/${commit_count}/g" \
            -e "s/@VERSION@/${version}/g" \
            .github/scripts/linux/rpm/ksnip.spec.in \
            > "$topdir/SPECS/ksnip.spec"

          echo "SOURCE_DATE_EPOCH=$commit_epoch" >> "$GITHUB_ENV"
          echo "topdir=$topdir" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "short_commit=$short_commit" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          test "$(rpm -E '%fedora')" = 44
          test "$(uname -m)" = x86_64
          dnf builddep -y "${{ steps.source.outputs.topdir }}/SPECS/ksnip.spec"

      - name: Build source and binary RPMs
        run: |
          set -euo pipefail
          rpmbuild -ba \
            --define "_topdir ${{ steps.source.outputs.topdir }}" \
            --define "_smp_build_ncpus 2" \
            "${{ steps.source.outputs.topdir }}/SPECS/ksnip.spec"

      - name: Show compiler cache statistics
        run: ccache --show-stats

      - name: Validate RPM payload and dependency closure
        run: |
          set -euo pipefail
          topdir="${{ steps.source.outputs.topdir }}"
          mapfile -t main_rpms < <(find "$topdir/RPMS" -type f -name 'ksnip-[0-9]*.x86_64.rpm' | sort)
          mapfile -t source_rpms < <(find "$topdir/SRPMS" -type f -name 'ksnip-*.src.rpm' | sort)

          test "${#main_rpms[@]}" -eq 1
          test "${#source_rpms[@]}" -eq 1
          main_rpm=${main_rpms[0]}

          rpm -K "$main_rpm" "${source_rpms[0]}"
          rpm -qpl "$main_rpm" | tee /tmp/ksnip-payload.txt
          rpm -qp --requires "$main_rpm" | tee /tmp/ksnip-requires.txt

          grep -Fx '/usr/bin/ksnip' /tmp/ksnip-payload.txt
          grep -Fx '/usr/share/applications/org.ksnip.ksnip.desktop' /tmp/ksnip-payload.txt
          grep -Fx '/usr/share/metainfo/org.ksnip.ksnip.appdata.xml' /tmp/ksnip-payload.txt
          grep -Fx '/usr/share/icons/hicolor/scalable/apps/ksnip.svg' /tmp/ksnip-payload.txt
          grep -Fx '/usr/share/ksnip/translations/kImageAnnotator_da.qm' /tmp/ksnip-payload.txt
          if grep -Fq '/usr/share/kImageAnnotator/' /tmp/ksnip-payload.txt; then
            echo 'Bundled translations conflict with Fedora kimageannotator-common' >&2
            exit 1
          fi
          if grep -Eq '(^|/)(include|cmake)/|\.a$' /tmp/ksnip-payload.txt; then
            echo 'Bundled development files leaked into the application RPM' >&2
            exit 1
          fi
          if grep -Eq 'libQt5|Qt_5' /tmp/ksnip-requires.txt; then
            echo 'Unexpected Qt 5 dependency in the Qt 6 RPM' >&2
            exit 1
          fi

          installroot="$RUNNER_TEMP/ksnip-installroot"
          dnf install -y \
            --installroot "$installroot" \
            --use-host-config \
            --releasever 44 \
            --setopt=install_weak_deps=False \
            "$main_rpm"

          echo '%_install_langs all' > /etc/rpm/macros.image-language-conf
          dnf install -y kimageannotator-common
          dnf install -y "$main_rpm"
          rpm -V ksnip
          test "$(rpm -qf /usr/bin/ksnip)" = "$(rpm -q ksnip)"
          common_translation=/usr/share/kImageAnnotator/translations/kImageAnnotator_da.qm
          test "$(rpm -qf "$common_translation")" = "$(rpm -q kimageannotator-common)"
          file /usr/bin/ksnip
          ldd /usr/bin/ksnip | tee /tmp/ksnip-ldd.txt
          ! grep -F 'not found' /tmp/ksnip-ldd.txt
          ! readelf -d /usr/bin/ksnip | grep -E '(RPATH|RUNPATH)'
          QT_QPA_PLATFORM=offscreen /usr/bin/ksnip --version

          desktop=/usr/share/applications/org.ksnip.ksnip.desktop
          desktop-file-validate "$desktop"
          grep -Fx 'Exec=/usr/bin/ksnip %F' "$desktop"
          grep -Fx 'Exec=/usr/bin/ksnip -f -c' "$desktop"
          grep -Fx 'X-KDE-DBUS-Restricted-Interfaces=org.kde.kwin.Screenshot,org.kde.KWin.ScreenShot2' "$desktop"
          ! grep -Eq '^Exec=ksnip([[:space:]]|$)' "$desktop"
          appstreamcli validate --no-net /usr/share/metainfo/org.ksnip.ksnip.appdata.xml

      - name: Upload RPMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ksnip-fedora-44-x86_64-${{ steps.source.outputs.short_commit }}
          path: |
            ${{ steps.source.outputs.topdir }}/RPMS/**/*.rpm
            ${{ steps.source.outputs.topdir }}/SRPMS/*.src.rpm
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Reset continuous release
        if: github.event_name == 'push'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag: 'continuous'
              });
              await github.rest.repos.deleteRelease({
                owner,
                repo,
                release_id: release.id
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            try {
              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: 'tags/continuous'
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }

      - name: Publish continuous release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: continuous
          target_commitish: ${{ github.sha }}
          name: Continuous Fedora 44 build
          body: Automated Fedora 44 x86_64 build for `${{ github.sha }}`.
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            ${{ steps.source.outputs.topdir }}/RPMS/**/*.rpm
            ${{ steps.source.outputs.topdir }}/SRPMS/*.src.rpm
